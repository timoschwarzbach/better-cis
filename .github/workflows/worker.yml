name: Worker

# Deploys the iCal endpoint in worker/.
#
# Deliberately separate from ci.yml: the worker and the extension version
# independently, and a Cloudflare outage or a missing token must never be able
# to block an extension release. The reverse is also true — this does not tag,
# bump, or publish anything.

on:
  push:
    branches: [master]
    paths:
      - "worker/**"
      - "src/lib/**"
      # A wrangler or esbuild bump changes the emitted bundle, so it has to be
      # able to trigger a deploy. The bundle check below discards the runs
      # where it turns out not to have.
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/worker.yml"
  pull_request:
    paths:
      - "worker/**"
      - "src/lib/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/worker.yml"
  workflow_dispatch:
    inputs:
      force:
        description: "Deploy even if the bundle is unchanged"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck and build
    runs-on: ubuntu-latest
    concurrency:
      group: worker-verify-${{ github.ref }}
      cancel-in-progress: true
    outputs:
      bundle: ${{ steps.bundle.outputs.hash }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - run: npm ci

      - name: Typecheck
        # Covers both programs: the worker's own, and the extension's — the
        # handler is shared source and has to satisfy each.
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build the bundle and hash it
        id: bundle
        env:
          BUILD: ${{ runner.temp }}/worker-build
        run: |
          # A dry run bundles exactly as a deploy would, so a broken
          # cross-package import fails here rather than in production.
          npx wrangler deploy --config worker/wrangler.toml --env="" \
            --dry-run --outdir "$BUILD"

          if [ ! -f "$BUILD/index.js" ]; then
            echo "::error::No bundle at $BUILD/index.js — has wrangler changed its output layout?"
            exit 1
          fi

          # Only the bundle. The sourcemap and the generated README embed the
          # output path, so they differ between runs even when nothing has
          # changed; index.js is byte-identical for identical input.
          HASH="$(sha256sum "$BUILD/index.js" | cut -d' ' -f1)"
          echo "hash=$HASH" >> "$GITHUB_OUTPUT"
          echo "Bundle sha256: $HASH"

  deploy:
    name: Deploy
    needs: verify
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    concurrency:
      group: worker-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - run: npm ci

      # Change detection, against the artifact rather than against the paths
      # that produced it. The path filter above is only a cheap first gate: it
      # matches all of src/lib/, but the worker imports about half of that, so
      # editing storage.ts or diff.ts produces an identical bundle and no
      # deploy. A cache entry under this key means this exact bundle has
      # already been deployed.
      #
      # Failure mode if the entry is evicted: a redundant deploy of identical
      # code. That is the direction to fail in — the reverse would silently
      # skip a real change.
      - name: Has this bundle been deployed?
        id: deployed
        uses: actions/cache/restore@v4
        with:
          path: .worker-deployed
          key: worker-bundle-${{ needs.verify.outputs.bundle }}

      - name: Deploy to Cloudflare
        id: run
        # Skipped rather than failed when no token is configured: a fork, or a
        # clone by someone who has not deployed an instance, should still see a
        # green build.
        if: steps.deployed.outputs.cache-hit != 'true' || inputs.force
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BUNDLE: ${{ needs.verify.outputs.bundle }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::notice::CLOUDFLARE_API_TOKEN is not set — skipping deploy."
            exit 0
          fi

          # --env="" targets the top-level environment. Once any [env.*] block
          # exists, a bare deploy is ambiguous, and the ambiguous case is the
          # one that overwrites production.
          npx wrangler deploy --config worker/wrangler.toml --env="" \
            --message "${GITHUB_SHA:0:7} — bundle ${BUNDLE:0:12}"

          echo "$BUNDLE $GITHUB_SHA" > .worker-deployed
          echo "deployed=true" >> "$GITHUB_OUTPUT"
          echo "::notice::Deployed bundle ${BUNDLE:0:12} from ${GITHUB_SHA:0:7}."

      - name: Remember what was deployed
        # Only after a deploy actually succeeded, so a failure retries next run
        # instead of being recorded as done.
        if: steps.run.outputs.deployed == 'true'
        uses: actions/cache/save@v4
        with:
          path: .worker-deployed
          key: worker-bundle-${{ needs.verify.outputs.bundle }}

      - name: Nothing to deploy
        if: steps.deployed.outputs.cache-hit == 'true' && !inputs.force
        run: echo "::notice::Bundle ${{ needs.verify.outputs.bundle }} is already live — skipping."
